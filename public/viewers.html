<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참여자 검색</title>
<style>
  :root{color-scheme:light dark;}
  body{margin:0;font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#12151A;color:#EDF1F4;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  @media (prefers-color-scheme: light){ body{background:#F4F5F3;color:#161A17;} }
  a{color:#0E9C8A;}
</style>
<script>
  // 참여자 검색은 '제재 이력 참여자' 4페이지로 옮겼다. 예전 주소(검색어 #q= 포함)는 그대로 넘겨준다.
  location.replace('/watch.html' + (/^#q=/.test(location.hash) ? location.hash : '#search'));
</script>
</head>
<body>
  <p>참여자 검색은 <a href="/watch.html#search">제재 이력 참여자 → 4 참여자 검색</a>으로 옮겼어요.</p>
</body>
</html>
