# Render Blueprint — Render 대시보드에서 "New +" → "Blueprint" 로 이 저장소를
# 연결하면 아래 설정이 자동으로 적용됩니다. (직접 "Web Service"로 만들어도 되고,
# 그 경우엔 Build/Start Command 칸에 아래 값을 손으로 넣어주면 됩니다.)
services:
  - type: web
    name: lshooooo-schedule-server
    runtime: node
    plan: free
    # package.json의 postinstall(`playwright install chromium`)이 npm install
    # 과정에서 Chromium을 알아서 받아옵니다. `--with-deps`는 root(su) 권한이
    # 필요해서 Render 빌드 환경에서 막히니 여기 buildCommand에는 넣지 않습니다.
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
